<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Periodic Table</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1>Periodic Table</h1>
    <div class="Periodic-table">
        <div class="periodic-grid">
            <button class="periodic-element nonmetal" style="grid-column: 1; grid-row: 1;" onclick="OpenElementModelc('H')"><span class="element-number">1</span><span class="element-symbol">H</span><span class="element-mass">1.008</span></button>
            <button class="periodic-element noble" style="grid-column: 18; grid-row: 1;" onclick="OpenElementModelc('He')"><span class="element-number">2</span><span class="element-symbol">He</span><span class="element-mass">4.002</span></button>
            <button class="periodic-element alkali" style="grid-column: 1; grid-row: 2;" onclick="OpenElementModelc('Li')"><span class="element-number">3</span><span class="element-symbol">Li</span><span class="element-mass">6.94</span></button>
            <button class="periodic-element alkaline" style="grid-column: 2; grid-row: 2;" onclick="OpenElementModelc('Be')"><span class="element-number">4</span><span class="element-symbol">Be</span><span class="element-mass">9.012</span></button>
            <button class="periodic-element metalloid" style="grid-column: 13; grid-row: 2;" onclick="OpenElementModelc('B')"><span class="element-number">5</span><span class="element-symbol">B</span><span class="element-mass">10.81</span></button>
            <button class="periodic-element nonmetal" style="grid-column: 14; grid-row: 2;" onclick="OpenElementModelc('C')"><span class="element-number">6</span><span class="element-symbol">C</span><span class="element-mass">12.011</span></button>
            <button class="periodic-element nonmetal" style="grid-column: 15; grid-row: 2;" onclick="OpenElementModelc('N')"><span class="element-number">7</span><span class="element-symbol">N</span><span class="element-mass">14.007</span></button>
            <button class="periodic-element nonmetal" style="grid-column: 16; grid-row: 2;" onclick="OpenElementModelc('O')"><span class="element-number">8</span><span class="element-symbol">O</span><span class="element-mass">15.999</span></button>
            <button class="periodic-element nonmetal" style="grid-column: 17; grid-row: 2;" onclick="OpenElementModelc('F')"><span class="element-number">9</span><span class="element-symbol">F</span><span class="element-mass">18.998</span></button>
            <button class="periodic-element noble" style="grid-column: 18; grid-row: 2;" onclick="OpenElementModelc('Ne')"><span class="element-number">10</span><span class="element-symbol">Ne</span><span class="element-mass">20.180</span></button>
            <button class="periodic-element alkali" style="grid-column: 1; grid-row: 3;" onclick="OpenElementModelc('Na')"><span class="element-number">11</span><span class="element-symbol">Na</span><span class="element-mass">22.990</span></button>
            <button class="periodic-element alkaline" style="grid-column: 2; grid-row: 3;" onclick="OpenElementModelc('Mg')"><span class="element-number">12</span><span class="element-symbol">Mg</span><span class="element-mass">24.305</span></button>
            <button class="periodic-element metalloid" style="grid-column: 13; grid-row: 3;" onclick="OpenElementModelc('Al')"><span class="element-number">13</span><span class="element-symbol">Al</span><span class="element-mass">26.982</span></button>
            <button class="periodic-element metalloid" style="grid-column: 14; grid-row: 3;" onclick="OpenElementModelc('Si')"><span class="element-number">14</span><span class="element-symbol">Si</span><span class="element-mass">28.085</span></button>
            <button class="periodic-element nonmetal" style="grid-column: 15; grid-row: 3;" onclick="OpenElementModelc('P')"><span class="element-number">15</span><span class="element-symbol">P</span><span class="element-mass">30.974</span></button>
            <button class="periodic-element nonmetal" style="grid-column: 16; grid-row: 3;" onclick="OpenElementModelc('S')"><span class="element-number">16</span><span class="element-symbol">S</span><span class="element-mass">32.06</span></button>
            <button class="periodic-element nonmetal" style="grid-column: 17; grid-row: 3;" onclick="OpenElementModelc('Cl')"><span class="element-number">17</span><span class="element-symbol">Cl</span><span class="element-mass">35.45</span></button>
            <button class="periodic-element noble" style="grid-column: 18; grid-row: 3;" onclick="OpenElementModelc('Ar')"><span class="element-number">18</span><span class="element-symbol">Ar</span><span class="element-mass">39.948</span></button>
            <button class="periodic-element alkali" style="grid-column: 1; grid-row: 4;" onclick="OpenElementModelc('K')"><span class="element-number">19</span><span class="element-symbol">K</span><span class="element-mass">39.098</span></button>
            <button class="periodic-element alkaline" style="grid-column: 2; grid-row: 4;" onclick="OpenElementModelc('Ca')"><span class="element-number">20</span><span class="element-symbol">Ca</span><span class="element-mass">40.078</span></button>
        </div>
    </div>
<div id="element-modal" class="modal-overlay" style="display: none;">
    <div class="modal-content">
        <button class="close-btn" onclick="closeModal()">&times;</button>
        
        <div class="modal-header">
            <span id="modal-symbol" class="modal-elem-symbol">H</span>
            <div>
                <h2 id="modal-name">Hydrogen</h2>
                <span id="modal-category" class="badge">Nonmetal</span>
            </div>
        </div>

        <div class="modal-body-grid">
            <div class="modal-stats">
                <p><strong>Atomic Number:</strong> <span id="modal-atomic-num">1</span></p>
                <p><strong>Mass Number:</strong> <span id="modal-mass">1.008</span></p>
                <p><strong>Protons:</strong> <span id="modal-protons">1</span></p>
                <p><strong>Melting Point:</strong> <span id="modal-melt">-259.2°C</span> | <strong>Boiling Point:</strong> <span id="modal-boil">-252.9°C</span></p>
                <p><strong>Everyday Use:</strong> <span id="modal-use">Rocket fuel, ammonia production, and powering fuel cells.</span></p>
            </div>
            
            <div class="modal-visual-interactive">
                <!-- Image place holder -->
                <div class="image-box">
                    <img id="modal-image" src="" alt="Element Image / Bohr Model" style="max-width: 100%; border-radius: 8px; display: none;">
                    <div id="image-placeholder" class="placeholder-text"> [ Element Image]</div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    const elementsData = {
        H: { name: "Hydrogen", num: 1, mass: "1.008", protons: 1, melt: "-259.2°C", boil: "-252.9°C", category: "Nonmetal", use: "Rocket fuel, fertilizer production (ammonia)."},
        He: { name: "Helium", num: 2, mass: "4.002", protons: 2, melt: "-272.2°C", boil: "-268.9°C", category: "Noble Gas", use: "Party balloons, MRI cooling, deep-sea diving breathing mixes."},
        Li: { name: "Lithium", num: 3, mass: "6.94", protons: 3, melt: "180.5°C", boil: "1342°C", category: "Alkali Metal", use: "Rechargeable batteries for phones and EVs."},
        Be: { name: "Beryllium", num: 4, mass: "9.012", protons: 4, melt: "1287°C", boil: "2470°C", category: "Alkaline Earth Metal", use: "Aerospace materials, X-ray windows."},
        B: { name: "Boron", num: 5, mass: "10.81", protons: 5, melt: "2076°C", boil: "3927°C", category: "Metalloid", use: "Borosilicate glass, detergents, and fiberglass."},
        C: { name: "Carbon", num: 6, mass: "12.011", protons: 6, melt: "3550°C", boil: "4827°C", category: "Nonmetal", use: "Organic compounds, fuels, and carbon fiber."},
        N: { name: "Nitrogen", num: 7, mass: "14.007", protons: 7, melt: "-210°C", boil: "-195.8°C", category: "Nonmetal", use: "Fertilizers, explosives, and cryogenics."},
        O: { name: "Oxygen", num: 8, mass: "15.999", protons: 8, melt: "-218.8°C", boil: "-183°C", category: "Nonmetal", use: "Respiration, steel production, and water treatment."},
        Ne: { name: "Neon", num: 10, mass: "20.180", protons: 10, melt: "-248.6°C", boil: "-246.1°C", category: "Noble Gas", use: "Neon signs, high-voltage indicators."},
        Na: { name: "Sodium",},
        Mg: { name:  "Magnesium",},
        Al: { name: "Aluminum",},
        Si: { name: "Silicon",},
        P: { name: "Phosphorus",},
        S: { name: "Sulfer",},
        Ar: { name: "Argon", },
        K: { name: "Potassium", },
        Ca: { name: "Calcium", }
    };

    function OpenElementModelc(symbol) {
            const data = elementsData[symbol];
            if (!data) return;

            const details = {
                name: data.name || 'Unknown',
                num: data.num ?? '',
                mass: data.mass ?? 'N/A',
                protons: data.protons ?? 'N/A',
                melt: data.melt ?? 'N/A',
                boil: data.boil ?? 'N/A',
                category: data.category || 'Unknown',
                use: data.use || 'No everyday use provided.'
            };

            document.getElementById('modal-symbol').innerText = symbol;
            document.getElementById('modal-name').innerText = details.name;
            document.getElementById('modal-atomic-num').innerText = details.num;
            document.getElementById('modal-mass').innerText = details.mass;
            document.getElementById('modal-protons').innerText = details.protons;
            document.getElementById('modal-melt').innerText = details.melt;
            document.getElementById('modal-boil').innerText = details.boil;
            document.getElementById('modal-use').innerText = details.use;
            document.getElementById('modal-category').innerText = details.category;

            const challengeFeedback = document.getElementById('challenge-feedback');
            if (challengeFeedback) {
                challengeFeedback.innerText = '';
            }

            document.getElementById('element-modal').style.display = 'flex';
        }

        function closeModal() {
            const modal = document.getElementById('element-modal');
            if (modal) {
                modal.style.display = 'none';
            }
        }
</script>
