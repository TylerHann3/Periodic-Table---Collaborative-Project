<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="style.css" rel="stylesheet">
    <script defer src="script.js"></script>
    <title>Periodic Table Quiz</title>
</head>
<body>
<!--setting up the objects for the quiz-->
<div class="container">
    <div id="question-container" class="hide">
        <div id="question">Question</div>

        <div id="answer-buttons" class="btn-grid">
            <button class="btn">Answer 1</button>
            <button class="btn">Answer 2</button>
            <button class="btn">Answer 3</button>
            <button class="btn">Answer 4</button>
        </div>
    </div>

    <div class="controls">
        <button id="start-Q1-btn" class="start-Q1-btn btn">
            Start Quiz 1
        <button id="start-Q2-btn" class="start-Q2-btn btn">
            Start Quiz 2
        <button id="start-Q3-btn" class="start-Q3-btn btn">
            Start Quiz 3

        <button id="next-btn" class="next-btn btn hide">
            Next
        <button id="menu-btn" class="hide">Back to Main Menu</button>
        </button>
    </div>
</div>
